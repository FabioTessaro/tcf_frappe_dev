name: tcf-frappe-dev
services:
  mariadb:
    image: docker.io/mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - mariadb-data:/var/lib/mysql
    env_file:
      - ../.env
    ports:
      - "3306:3306"

  redis-cache:
    image: docker.io/redis:alpine
    restart: unless-stopped

  redis-queue:
    image: docker.io/redis:alpine
    restart: unless-stopped
  
  seaweedfs:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: 'server -s3 -webdav -dir=/data -ip.bind=0.0.0.0'
    ports:
      - "9333:9333"   # master
      - "8888:8888"   # Filer
      - "8333:8333"   # S3
      - "8080:8080"   # Volume
      - "7333:7333"   # WebDAV
    volumes:
      - seaweedfs-data:/data
    env_file:
      - ../.env
  
  meet-sfu:
    image: ghcr.io/frappe/meet/sfu-server:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - WEBRTC_LISTEN_IP=0.0.0.0
      # Upstream's own default range is 40000-49999 (10k ports); narrowed
      # here to keep the published port list sane for a small/dev
      # deployment. Widen both this and the matching `ports:` entry below
      # if you need more concurrent participants than that comfortably
      # supports.
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=40099
    ports:
      - "3000:3000"
      - "40000-40099:40000-40099/udp"

  frappe:
    image: docker.io/frappe/bench:latest
    restart: unless-stopped
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      - SHELL=/bin/bash
      - CLAUDE_CONFIG_DIR=/home/frappe/.claude
    volumes:
      - ..:/workspace:cached
      - ${HOME}/.ssh:/home/frappe/.ssh:cached
      - ${HOME}/.gitconfig:/home/frappe/.gitconfig:ro
      - vscode-server:/home/frappe/.vscode-server
      - claude-config:/home/frappe/.claude
    working_dir: /workspace
    ports:
      - "8000-8005:8000-8005"
      - "9000-9005:9000-9005"
      - "6787:6787"
      
volumes:
  mariadb-data:
  seaweedfs-data:
  vscode-server:
  claude-config: