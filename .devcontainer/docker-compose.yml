name: tcf-frappe-dev
services:
  mariadb:
    image: docker.io/mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - mariadb-data:/var/lib/mysql
    env_file:
      - ../.env
    ports:
      - "3306:3306"

  redis-cache:
    image: docker.io/redis:alpine
    restart: unless-stopped

  redis-queue:
    image: docker.io/redis:alpine
    restart: unless-stopped
  
  seaweedfs:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: 'server -s3 -dir=/data -ip.bind=0.0.0.0'
    ports:
      - "9333:9333"   # master — cluster coordination, weed shell/admin access
      - "8888:8888"   # filer web UI — browse files at tcf.local:8888
      - "8333:8333"   # S3 API — this is the one Frappe/boto3/NX launcher use
    volumes:
      - seaweedfs-data:/data
    env_file:
      - ../.env

  frappe:
    image: docker.io/frappe/bench:latest
    restart: unless-stopped
    command: sleep infinity
    env_file:
      - ../.env
    environment:
      - SHELL=/bin/bash
      - CLAUDE_CONFIG_DIR=/home/frappe/.claude
    volumes:
      - ..:/workspace:cached
      - ${HOME}/.ssh:/home/frappe/.ssh:cached
      - ${HOME}/.gitconfig:/home/frappe/.gitconfig:ro
      - vscode-server:/home/frappe/.vscode-server
      - claude-config:/home/frappe/.claude
    working_dir: /workspace
    ports:
      - "8000-8005:8000-8005"
      - "9000-9005:9000-9005"
      - "6787:6787"
      
volumes:
  mariadb-data:
  seaweedfs-data:
  vscode-server:
  claude-config:
  codex-config:
