# -----------------------------------------------------------------------------
# frappe-dev script settings
# -----------------------------------------------------------------------------
# Plain KEY=VALUE pairs read (not executed) by every root script. These are
# project-level knobs, not per-installation answers — those live in .env and
# are written by ./setup.sh.
# -----------------------------------------------------------------------------

# Docker Compose project name. Containers are called <name>-<service>-1 and
# named volumes <name>_<volume>. Changing this after ./initialize.sh has run
# orphans the old containers/volumes (remove them with ./teardown.sh first).
COMPOSE_PROJECT_NAME=tcf-frappe-dev

# How many log files to keep per script in ./logs (older runs are deleted).
LOG_KEEP=5

# Seconds to wait for MariaDB / SeaweedFS to answer after the containers start.
SERVICE_WAIT_TIMEOUT=300

# Container user and home directory of the frappe/bench image.
CONTAINER_USER=frappe
CONTAINER_HOME=/home/frappe

# How many tags are shown at once in setup.sh's version picker.
VERSION_PICKER_LIMIT=15
