# -----------------------------------------------------------------------------
# Example answers file for unattended runs:   ./setup.sh --answers my.conf
# -----------------------------------------------------------------------------
# Same keys as .env. Every key present here is used without asking; every key
# missing is asked interactively (or, on a re-run, kept from the current .env).
# Without a terminal, missing values make setup.sh stop with a clear error.
#
# Secrets: write the value, or @generate for a random one.
# Versions: any tag or branch of the app's repository (verified online).
# Booleans: 1 or 0.
# Copy this file somewhere safe: it may contain secrets. Never commit it.
# -----------------------------------------------------------------------------

# Default apps (see bootstrap/templates/apps.catalog) and versions
FRAPPE_VERSION=v16.0.0
DEFAULT_APPS="erpnext hrms"
ERPNEXT_VERSION=v16.0.0
HRMS_VERSION=v16.0.0

# Secrets
ADMIN_PASSWORD=@generate
MARIADB_ROOT_USERNAME=root
MARIADB_ROOT_PASSWORD=@generate
SEAWEEDFS_ACCESS_KEY=@generate
SEAWEEDFS_SECRET_KEY=@generate
# Only when meet is selected:
# JWT_SECRET=@generate
# MEET_ANNOUNCED_IP=192.168.1.10

# Storage and services (suggested buckets: bootstrap/templates/buckets.list)
SEAWEEDFS_BUCKETS="cad-vault attachments-vault drive-vault public-assets quarantine audit-archive"
MARIADB_EXPOSE_PORT=1

# Sites (the test sites are always test.<SITE_NAME>, with every app, and
# test-minimal.<SITE_NAME>, with the core app only)
SITE_NAME=dev.local
MAIN_SITE_DEVELOPER_MODE=1

# Custom apps. The git prefix is where ./new-platform.sh and ./new-app.sh
# create repositories and where ./initialize.sh clones apps from.
CUSTOM_APPS_GIT_PREFIX=git@github.com:my-org
# Only apps whose repositories already exist; empty on a fresh start
# (./new-app.sh adds every app it creates). Core app first.
CUSTOM_APPS=""
# CUSTOM_APPS="my_core my_feature"
# CUSTOM_APP_URLS="my_feature=git@gitlab.com:other/my_feature.git"
# CORE_APP=my_core

# Platform repository (normally recorded by ./new-platform.sh). Set it to
# rebuild a new host: ./initialize.sh clones it into ./platform.
# PLATFORM_URL=git@github.com:my-org/platform.git
