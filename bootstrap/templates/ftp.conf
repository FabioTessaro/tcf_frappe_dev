# -----------------------------------------------------------------------------
# vsftpd settings applied by ./install.sh (FTP component) to /etc/vsftpd.conf.
# KEY=VALUE, one per line. Existing keys are updated, missing ones appended.
# The passive port range is also opened in UFW when UFW is active.
# -----------------------------------------------------------------------------
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=50000
