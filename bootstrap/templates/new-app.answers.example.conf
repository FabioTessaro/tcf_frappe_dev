# Example answers for ./new-app.sh --answers FILE (KEY=VALUE).
# Missing keys are asked in the terminal.

# Frappe app name and repository name: ^[a-z][a-z0-9_]*$ (SYS-APP-001)
APP_NAME=hr
# core (the first app, exactly one) | foundation | feature
APP_KIND=feature
APP_TITLE=HR
APP_DESCRIPTION=Human resources: employees, leave and attendance
# Other hard dependencies besides the core app, space separated (prefer none, SYS-DEP-010)
APP_REQUIRED=
# private | public
APP_VISIBILITY=private
# proprietary | mit | apache-2.0 | agpl-3.0 | gpl-3.0
APP_LICENSE=proprietary
APP_COPYRIGHT=My Company S.r.l.
# solo = one maintainer, merges after self-review; team = one approval by someone else
APP_TEAM=solo
