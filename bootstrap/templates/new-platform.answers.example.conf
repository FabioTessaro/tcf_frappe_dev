# Example answers for ./new-platform.sh --answers FILE (KEY=VALUE).
# Missing keys are asked in the terminal.

# GitHub user or organisation that owns the platform repository
PLATFORM_OWNER=my-org
# Repository name (default: platform)
PLATFORM_REPO=platform
# private | public
PLATFORM_VISIBILITY=private
# proprietary | mit | apache-2.0 | agpl-3.0 | gpl-3.0
PLATFORM_LICENSE=proprietary
PLATFORM_COPYRIGHT=My Company S.r.l.
# Frappe release tag locked in platform.lock
FRAPPE_VERSION=v16.0.0
